.warning{border-left:5px solid #b77718;padding:14px;background:#fff4db}label{display:block}summary{cursor:pointer;font-weight:600}</style><main id="app"><p class="warning">Local cleaning review · No data changes until explicit CLI apply. Open cleaned.csv in a text editor; spreadsheet formula risk is documented.</p></main><script id="data" type="application/json">{"version": 1, "kind": "proposals", "source_sha256": "c791cf8bed05b16696be764907831cfa7c437a292869deaef960d44e14834a45", "headers": ["order_id", "status", "shipped", "note"], "profile": {"rows": 5, "columns": {"order_id": {"missing": 0, "distinct": 4, "type_counts": {"integer_like": 5}, "inferred_type": "integer_like", "whitespace": 0, "leading_zero_values": 5, "missing_markers": 0, "ambiguous_dates": 0, "value_counts": [{"value": "004", "count": 2, "truncated": false}, {"value": "001", "count": 1, "truncated": false}, {"value": "002", "count": 1, "truncated": false}, {"value": "003", "count": 1, "truncated": false}]}, "status": {"missing": 0, "distinct": 4, "type_counts": {"text": 5}, "inferred_type": "text", "whitespace": 1, "leading_zero_values": 0, "missing_markers": 0, "ambiguous_dates": 0, "value_counts": [{"value": "done", "count": 2, "truncated": false}, {"value": " pending ", "count": 1, "truncated": false}, {"value": "pendng", "count": 1, "truncated": false}, {"value": "Pending", "count": 1, "truncated": false}]}, "shipped": {"missing": 0, "distinct": 4, "type_counts": {"text": 5}, "inferred_type": "text", "whitespace": 0, "leading_zero_values": 0, "missing_markers": 0, "ambiguous_dates": 1, "value_counts": [{"value": "18/04/2026", "count": 2, "truncated": false}, {"value": "03/04/2026", "count": 1, "truncated": false}, {"value": "17/04/2026", "count": 1, "truncated": false}, {"value": "not-a-date", "count": 1, "truncated": false}]}, "note": {"missing": 0, "distinct": 4, "type_counts": {"text": 5}, "inferred_type": "text", "whitespace": 0, "leading_zero_values": 0, "missing_markers": 1, "ambiguous_dates": 0, "value_counts": [{"value": "complete", "count": 2, "truncated": false}, {"value": "legitimate repeated orders must be reviewed", "count": 1, "truncated": false}, {"value": "N/A", "count": 1, "truncated": false}, {"value": "=1+1", "count": 1, "truncated": false}]}}, "column_count": 4, "duplicate_rows": 1, "formula_risk_cells": 1, "formula_risk_headers": 0, "suspicious_records": [{"record": 1, "column": "shipped", "reason": "ambiguous_day_month"}, {"record": 3, "column": "note", "reason": "spreadsheet_formula_prefix"}], "suspicious_count": 2, "notice": "Pattern counts and inferred types are diagnostics, not proof of data correctness."}, "shared_columns": [], "mode": "imported_recipe", "proposals": [{"id": "p1", "operation": {"kind": "trim", "column": "status"}, "reason": "Imported recipe; re-review against this input and preview.", "risk": "meaning_change_possible"}, {"id": "p2", "operation": {"kind": "replace_exact", "column": "status", "mapping": {"pendng": "pending", "Pending": "pending"}}, "reason": "Imported recipe; re-review against this input and preview.", "risk": "meaning_change_possible"}, {"id": "p3", "operation": {"kind": "blank_markers", "column": "note", "markers": ["N/A"]}, "reason": "Imported recipe; re-review against this input and preview.", "risk": "meaning_change_possible"}, {"id": "p4", "operation": {"kind": "date_iso", "column": "shipped", "format": "%d/%m/%Y"}, "reason": "Imported recipe; re-review against this input and preview.", "risk": "meaning_change_possible"}, {"id": "p5", "operation": {"kind": "drop_exact_duplicates"}, "reason": "Imported recipe; re-review against this input and preview.", "risk": "record_deletion"}], "rejected": [], "errors": [], "model": {"calls": 0, "usage": {}}, "digest": "66c98a78d40bc1a609e5545924fcbe151363f1fafea4288e7b14e6038ef4030b"}</script><script>const data=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
function node(tag,text,parent=app){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;parent.appendChild(n);return n;}
function json(value,parent=app){node('pre',JSON.stringify(value,null,2),parent);}
function download(name,value){const u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=node('a');a.href=u;a.download=name;a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
node('h1',data.kind==='proposals'?'Review cleaning proposals':'Inspect exact cleaning preview');
node('p','Input SHA-256: '+data.source_sha256);
node('p','This file stays local. Suggestions are unapproved. Hashes detect stale artifacts, not reviewer identity.');
const label=node('label','Reviewer name or local alias');const reviewer=node('input',undefined,label);reviewer.value='local reviewer';reviewer.maxLength=100;
const choices=[];
if(data.kind==='proposals'){
 node('p','Reject is the default. Modify edits operation JSON only; the CLI validates it again. Operations run in listed order.');
 for(const p of data.proposals){const card=node('article');node('h2',p.id+' · '+p.operation.kind,card);node('p',p.reason,card);node('p','Risk: '+p.risk,card);
 const select=node('select',undefined,card);for(const v of ['reject','accept','modify']){const o=node('option',v,select);o.value=v;}
 const edit=node('textarea',undefined,card);edit.value=JSON.stringify(p.operation,null,2);edit.disabled=true;select.onchange=()=>{edit.disabled=select.value!=='modify';};choices.push({p,select,edit});}
 const button=node('button','Download decisions for preview');button.onclick=()=>{try{if(!reviewer.value.trim())throw Error('Reviewer required');
 const decisions=choices.map(({p,select,edit})=>{const d={id:p.id,decision:select.value};if(select.value==='modify')d.operation=JSON.parse(edit.value);return d;});
 download('review.json',{proposal_digest:data.digest,reviewer:reviewer.value,decisions});}catch(e){alert(e.message);}};
}else{
 node('p','All affected cells and removed original record IDs are listed below. Invalid dates remain unchanged. Review semantic correctness, not just fewer warnings.');
 for(let i=0;i<data.steps.length;i++){const card=node('article');node('h2','Step '+(i+1)+' · '+data.operations[i].kind,card);json(data.operations[i],card);json(data.steps[i],card);}
 const c=node('label','I reviewed these exact changes and approve this preview.');const box=node('input',undefined,c);box.type='checkbox';
 const button=node('button','Download explicit approval');button.onclick=()=>{if(!box.checked||!reviewer.value.trim()){alert('Review, check approval, and enter your alias.');return;}

}
