name: Manual pinned local model smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'datarescue/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'tests/**'
      - '.github/workflows/live-model.yml'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  local-model:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/download_model.py --out ../datarescue-model
      - run: PYTHONPATH=. python scripts/verify_local.py --model-dir ../datarescue-model --out live-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-model-evidence
          path: live-evidence/
