name: Tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install ruff==0.17.1 build==1.6.1
      - run: python -m unittest discover -v
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q datarescue scripts tests
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - run: datarescue profile --input fixtures/orders.csv
      - run: PYTHONPATH=. python scripts/offline_demo.py --out demo
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python scripts/offline_demo.py --out browser-demo
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser_smoke.cjs browser-demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-verification
          path: browser-demo/browser-verification.json
          retention-days: 14
